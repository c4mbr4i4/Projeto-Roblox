name: Build Roblox

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rojo 7.6.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tools build
          gh release download v7.6.1 --repo rojo-rbx/rojo --pattern rojo-7.6.1-linux-x86_64.zip --dir .tools
          unzip .tools/rojo-7.6.1-linux-x86_64.zip -d .tools
          chmod +x .tools/rojo
      - name: Gerar place
        run: .tools/rojo build default.project.json --output build/ProjetoRoblox.rbxlx
      - uses: actions/upload-artifact@v4
        with:
          name: ProjetoRoblox
          path: build/ProjetoRoblox.rbxlx
          if-no-files-found: error
